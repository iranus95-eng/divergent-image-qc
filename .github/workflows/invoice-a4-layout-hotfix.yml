name: Invoice A4 layout hotfix

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/invoice_layout_hotfix.py'
      - '.github/workflows/invoice-a4-layout-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/invoice_layout_hotfix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/invoice-master-dropdowns.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Adjust invoice preview scale and anchor A4 footer"
          git push
