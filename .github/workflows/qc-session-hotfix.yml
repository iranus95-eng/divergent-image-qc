name: QC session hotfix

on:
  push:
    branches:
      - qc-session-hotfix-prod-2026-09-07
    paths:
      - scripts/hotfix-qc-session.py
      - .github/workflows/qc-session-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qc-session-hotfix-prod-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch QC session flow
        run: python scripts/hotfix-qc-session.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix QC for web session login"
          git push origin HEAD:qc-session-hotfix-prod-2026-09-07
