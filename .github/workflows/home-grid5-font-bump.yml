name: Home grid5 font bump
on:
  push:
    branches: [main]
    paths:
      - 'scripts/home_grid5_font_bump.py'
      - '.github/workflows/home-grid5-font-bump.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/home_grid5_font_bump.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Increase home menu typography"
          git push
