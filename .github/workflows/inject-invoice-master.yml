name: Inject invoice master dropdowns
on:
  push:
    branches: [main]
    paths:
      - 'js/invoice-master-dropdowns.js'
      - '.github/workflows/inject-invoice-master.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject external invoice master script safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./js/invoice-master-dropdowns.js?v=20260907-1"></script>'
          # Remove any previous occurrence first. A prior workflow inserted the tag
          # before the first literal </body>, which can be inside a JS print template
          # and causes the browser to terminate the main <script> early.
          s=s.replace(tag+'\n','').replace(tag,'')
          pos=s.rfind('</body>')
          if pos < 0:
              raise SystemExit('index.html has no </body>')
          s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Commit injected tag
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix invoice script injection placement"
          git push origin main
