name: Integrate V3 Shell

on:
  push:
    branches: [rebuild-clean-v3]
    paths:
      - '.github/workflows/integrate-v3-shell.yml'
      - 'scripts/integrate-v3-shell.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-clean-v3
      - name: Patch index.html for V3 shell
        run: python scripts/integrate-v3-shell.py
      - name: Commit integration
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate V3 auth and sidebar shell"
          git push origin HEAD:rebuild-clean-v3
