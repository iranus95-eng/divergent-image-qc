name: Global Navigation Buttons
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/global_navigation_buttons.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/global_navigation_buttons.py
      - name: Commit patched index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Back and Home buttons to all screens"
          git push
