name: Apply approved invoice BAHTTEXT layout

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/invoice_bahttext_layout_fix.py'
      - '.github/workflows/invoice-layout-bahttext-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved invoice layout
        run: python scripts/invoice_bahttext_layout_fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Update invoice table with Thai BAHTTEXT total row"
          git push
