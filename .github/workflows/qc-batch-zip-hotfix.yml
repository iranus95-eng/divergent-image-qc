name: QC batch ZIP hotfix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/qc_batch_zip_hotfix.py'
      - '.github/workflows/qc-batch-zip-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch QC batch ZIP + wide detail grid
        run: python scripts/qc_batch_zip_hotfix.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add per-batch ZIP download and widen QC gallery'
          git push origin main
