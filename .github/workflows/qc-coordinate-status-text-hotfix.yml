name: QC coordinate status text hotfix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/qc_coordinate_status_text_hotfix.py'
      - '.github/workflows/qc-coordinate-status-text-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch QC coordinate status text
        run: python scripts/qc_coordinate_status_text_hotfix.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clarify QC GPS and meter coordinate status'
          git push origin main
