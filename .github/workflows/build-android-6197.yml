name: Build Android 6.19.7 LIVE GPS Restore
on:
  workflow_dispatch:
  push:
    branches: [ android-live-gps-6197 ]
    paths:
      - 'android-hotfix-6.19.7/**'
      - '.github/workflows/build-android-6197.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand Android hotfix source
        run: |
          cd android-hotfix-6.19.7
          cat project.part00 project.part01 project.part02 project.part03 | base64 -d > project.tar.gz
          echo "43b1bc0ca8c2d2fe73392ba436274f69a9489e5a72bc93d998fed845901666bd  project.tar.gz" | sha256sum -c -
          tar -xzf project.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android-hotfix-6.19.7
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DivergentFieldTools-6.19.7-LIVE-GPS-RESTORE
          path: android-hotfix-6.19.7/app/build/outputs/apk/release/app-release.apk
