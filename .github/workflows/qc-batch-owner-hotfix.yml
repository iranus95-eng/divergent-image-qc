name: QC batch employee name hotfix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/qc_batch_owner_hotfix.py'
      - '.github/workflows/qc-batch-owner-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add employee names to QC batch cards
        run: python scripts/qc_batch_owner_hotfix.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show employee names on QC batch cards'
          git push origin main
