<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divergent Image Rescue - QC Center</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 36px auto;
      padding: 0 20px 40px;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
    }

    .header p {
      margin: 8px 0 0;
      color: #666;
      font-size: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      margin-bottom: 16px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: #6c4ed9;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f3f0ff;
      display: none;
      white-space: pre-wrap;
    }

    .status-error {
      background: #fff0f0;
      color: #a00000;
    }

    .batch-area {
      margin-top: 28px;
      display: none;
    }

    .batch-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .batch-header h2 {
      margin: 0;
    }

    .batch-count {
      color: #666;
    }

    .batch {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-top: 12px;
      background: #fafafa;
      cursor: pointer;
      transition: 0.15s;
    }

    .batch:hover {
      border-color: #6c4ed9;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .batch strong {
      font-size: 18px;
    }

    .batch-row {
      margin-top: 7px;
    }

    .status {
      margin-top: 10px;
      color: #138a3d;
      font-weight: bold;
    }

    .detail-area {
      display: none;
      margin-top: 24px;
    }

    .detail-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .detail-top h2 {
      margin: 0;
    }

    .ca-group {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #ddd;
    }

    .ca-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .image-card {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
    }

    .image-card img {
      width: 100%;
      height: 240px;
      object-fit: contain;
      background: #eee;
      border-radius: 8px;
      cursor: pointer;
    }

    .image-loading {
      width: 100%;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eee;
      border-radius: 8px;
      color: #666;
      font-size: 14px;
    }

    .image-error {
      width: 100%;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff0f0;
      border-radius: 8px;
      color: #a00000;
      text-align: center;
      padding: 10px;
    }

    .image-name {
      margin-top: 8px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .line-share-button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #06c755;
      color: white;
      border-radius: 8px;
    }

    .copy-note {
      margin-top: 7px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }

    .empty {
      padding: 22px;
      text-align: center;
      color: #666;
      border: 1px dashed #ccc;
      border-radius: 12px;
      background: #fafafa;
    }

    .key-box {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .key-status {
      margin-left: 10px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Divergent Image Rescue</h1>
      <p>QC Center</p>
    </div>

    <div class="card">
      <label for="siteSelect">เลือก Site งาน</label>

      <select id="siteSelect" disabled>
        <option value="">-- เลือก Site --</option>
        <option value="UDON">การไฟฟ้าส่วนภูมิภาคสาขาอุดรธานี</option>
        <option value="PHUWIANG">การไฟฟ้าส่วนภูมิภาคอำเภอภูเวียง</option>
        <option value="KRANUAN">การไฟฟ้าส่วนภูมิภาคสาขากระนวน</option>
        <option value="KOSUM">การไฟฟ้าส่วนภูมิภาคอำเภอโกสุมพิสัย</option>
        <option value="NONGSONGHONG">การไฟฟ้าส่วนภูมิภาคสาขาหนองสองห้อง</option>
        <option value="BANFANG">การไฟฟ้าส่วนภูมิภาคอำเภอบ้านฝาง</option>
        <option value="PHUKHIAO">การไฟฟ้าส่วนภูมิภาคสาขาภูเขียว</option>
        <option value="MANCHAKHIRI">การไฟฟ้าส่วนภูมิภาคสาขามัญจาคีรี</option>
        <option value="CHATTURAT">การไฟฟ้าส่วนภูมิภาคสาขาจัตุรัส</option>
        <option value="CHAIYAPHUM">การไฟฟ้าส่วนภูมิภาคจังหวัดชัยภูมิ</option>
        <option value="KAENGKHRO">การไฟฟ้าส่วนภูมิภาคสาขาแก้งคร้อ</option>
        <option value="NONGKI">การไฟฟ้าส่วนภูมิภาคสาขาหนองกี่</option>
        <option value="PRAKHONCHAI">การไฟฟ้าส่วนภูมิภาคสาขาประโคนชัย</option>
        <option value="KORAT2">การไฟฟ้าส่วนภูมิภาคสาขาเมืองนครราชสีมา2 (หัวทะเล)</option>
        <option value="PHUTTHAISONG">การไฟฟ้าส่วนภูมิภาคสาขาพุทไธสง</option>
        <option value="CHUMPHUANG">การไฟฟ้าส่วนภูมิภาคสาขาชุมพวง</option>
        <option value="SUNGNOEN">การไฟฟ้าส่วนภูมิภาคสาขาสูงเนิน</option>
        <option value="NONTHAI">การไฟฟ้าส่วนภูมิภาคสาขาโนนไทย</option>
        <option value="KANTHARALAK">การไฟฟ้าส่วนภูมิภาคสาขากันทรลักษ์</option>
        <option value="PRATHAI">การไฟฟ้าส่วนภูมิภาคอำเภอประทาย</option>
        <option value="BUAYAI">การไฟฟ้าส่วนภูมิภาคอำเภอบัวใหญ่</option>
        <option value="NONGBUNMAK">การไฟฟ้าส่วนภูมิภาคอำเภอหนองบุญมาก</option>
      </select>

      <button id="loadButton" onclick="loadBatches()" disabled>ดู Batch จาก Server</button>

      <div id="statusBox" class="status-box"></div>

      <div id="batchArea" class="batch-area">
        <div class="batch-header">
          <h2>รายการ Batch</h2>
          <div id="batchCount" class="batch-count"></div>
        </div>
        <div id="batchList"></div>
      </div>

      <div id="detailArea" class="detail-area">
        <div class="detail-top">
          <button onclick="closeBatchDetail()">← กลับรายการ Batch</button>
          <h2 id="detailTitle">รายละเอียด Batch</h2>
        </div>
        <div id="detailStatus" class="status-box"></div>
        <div id="imageGroups"></div>
      </div>

      <div id="lineUserBox" class="key-box">
        <strong>LINE Login</strong>
        <span id="lineUserStatus" class="key-status">กำลังตรวจสอบ...</span>
      </div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2011407195-ZXPgFEKe";
    const QC_API_URL =
      "https://neauzvqroaszvqffahkv.functions.supabase.co/qc-api";

    async function getLineAccessToken() {
      if (!window.liff || !liff.isLoggedIn()) {
        throw new Error("LINE_NOT_LOGGED_IN");
      }

      const token = liff.getAccessToken();
      if (!token) {
        throw new Error("LINE_ACCESS_TOKEN_NOT_AVAILABLE");
      }

      return token;
    }

    async function qcApi(action, payload = {}) {
      const accessToken = await getLineAccessToken();

      const response = await fetch(QC_API_URL, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ action, ...payload })
      });

      const responseText = await response.text();
      let data = {};

      try {
        data = responseText ? JSON.parse(responseText) : {};
      } catch (_) {
        throw new Error(
          "Server ตอบกลับไม่ถูกต้อง HTTP " +
          response.status +
          ": " +
          responseText.slice(0, 200)
        );
      }

      if (!response.ok) {
        throw new Error(data?.error || ("HTTP " + response.status));
      }

      return data;
    }

    function showStatus(message, isError = false) {
      const box = document.getElementById("statusBox");
      box.style.display = "block";
      box.textContent = message;
      box.className = isError
        ? "status-box status-error"
        : "status-box";
    }

    function formatRawDate(rawDate) {
      if (!rawDate || rawDate.length !== 8) return rawDate || "-";
      return rawDate.slice(0,2) + "/" +
             rawDate.slice(2,4) + "/" +
             rawDate.slice(4,8);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function parseCAFromName(name) {
      const m = String(name || "").match(/^INSx(\d+)_/i);
      return m ? m[1] : "ไม่ทราบ CA";
    }

    function encodePath(path) {
      return String(path).split("/").map(encodeURIComponent).join("/");
    }


    async function initLiff() {
      const status = document.getElementById("lineUserStatus");

      try {
        status.textContent = "กำลังเชื่อมต่อ LINE...";

        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        if (!liff.isLoggedIn()) {
          status.textContent = "กำลังเข้าสู่ระบบ LINE...";
          liff.login({
            redirectUri: window.location.href
          });
          return;
        }

        status.textContent = "กำลังอ่านบัญชี LINE...";

        const profile = await liff.getProfile();
        window.lineProfile = profile;

        status.textContent =
          "เข้าสู่ระบบ LINE แล้ว ✓ " +
          (profile.displayName || "");

        await checkQcAccess();

      } catch (error) {
        status.textContent =
          "LINE Login ไม่สำเร็จ: " +
          (error && (error.message || error.code)
            ? (error.message || error.code)
            : String(error));
        setQcEnabled(false);
      }
    }

    function setQcEnabled(enabled) {
      document.getElementById("siteSelect").disabled = !enabled;
      document.getElementById("loadButton").disabled = !enabled;
      window.qcAccessAllowed = !!enabled;
    }

    async function checkQcAccess() {
      const status = document.getElementById("lineUserStatus");
      const profile = window.lineProfile;

      setQcEnabled(false);

      if (!profile || !profile.userId) {
        status.textContent = "ยังไม่สามารถอ่านบัญชี LINE ได้";
        return false;
      }

      status.textContent = "กำลังตรวจสิทธิ์ QC...";

      try {
        const user = await qcApi("access");

        if (!user || user.allowed !== true) {
          status.textContent =
            "ไม่มีสิทธิ์เข้า QC ✕ · กรุณาติดต่อผู้ดูแลระบบ";
          return false;
        }

        status.textContent =
          "อนุญาตเข้า QC ✓ " +
          (user.display_name || profile.displayName || "") +
          " · " +
          (user.user_role || "user");

        window.qcAuthorizedUser = user;
        setQcEnabled(true);
        return true;
      } catch (error) {
        status.textContent =
          "ตรวจสิทธิ์ QC ไม่สำเร็จ: " + (error.message || error);
        setQcEnabled(false);
        return false;
      }
    }

    async function loadBatches() {
      const siteCode = document.getElementById("siteSelect").value;
      const button = document.getElementById("loadButton");
      const area = document.getElementById("batchArea");
      const list = document.getElementById("batchList");
      const count = document.getElementById("batchCount");

      if (!window.qcAccessAllowed) {
        alert("บัญชีนี้ยังไม่ได้รับอนุญาตให้เข้า QC");
        return;
      }

      if (!siteCode) {
        alert("กรุณาเลือก Site งาน");
        return;
      }

      button.disabled = true;
      document.getElementById("detailArea").style.display = "none";
      area.style.display = "none";
      list.innerHTML = "";
      count.textContent = "";
      showStatus("กำลังดึงรายการ Batch จาก Server...");

      try {
        const result = await qcApi("batches", { siteCode });
        const batches = result.batches || [];
        window.currentBatches = batches;

        area.style.display = "block";
        count.textContent = batches.length + " ชุด";

        if (batches.length === 0) {
          list.innerHTML =
            '<div class="empty">ยังไม่มี Batch สำหรับ Site นี้</div>';
          showStatus("เชื่อมต่อ Server สำเร็จ ✓ แต่ยังไม่มี Batch");
          return;
        }

        list.innerHTML = batches.map((batch, index) => `
          <div class="batch" onclick="openBatchDetail(${index})">
            <strong>${escapeHtml(batch.batch_id)}</strong>
            <div class="batch-row">Site: ${escapeHtml(batch.site_name)}</div>
            <div class="batch-row">วันที่: ${escapeHtml(formatRawDate(batch.raw_date))}</div>
            <div class="batch-row">จำนวนรูป: ${escapeHtml(batch.image_count)} รูป</div>
            <div class="batch-row">จำนวน CA: ${escapeHtml(batch.ca_count)}</div>
            <div class="status">สถานะ: ${escapeHtml(batch.status || "UPLOADED")}</div>
            <div class="batch-row" style="margin-top:8px;font-weight:700;">แตะเพื่อเปิดดูรูป →</div>
          </div>
        `).join("");

        showStatus("ดึงข้อมูลจาก Server สำเร็จ ✓");
      } catch (error) {
        area.style.display = "none";
        showStatus("ดึงข้อมูลไม่สำเร็จ: " + (error.message || error), true);
      } finally {
        button.disabled = false;
      }
    }

    async function createSignedImageUrl(objectPath) {
      const result = await qcApi("signed-url", { objectPath });

      if (!result?.signedUrl) {
        throw new Error("Server ไม่คืน signed URL");
      }

      return result.signedUrl;
    }

    async function fetchPrivateImage(objectPath) {
      const signedUrl = await createSignedImageUrl(objectPath);

      const response = await fetch(signedUrl, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        const responseText = await response.text().catch(() => "");
        throw new Error(
          "เปิดรูปไม่สำเร็จ HTTP " +
          response.status +
          (responseText ? ": " + responseText.slice(0,160) : "")
        );
      }

      const blob = await response.blob();
      return URL.createObjectURL(blob);
    }

    async function openBatchDetail(index) {
      const batch = (window.currentBatches || [])[index];
      if (!batch) return;
      window.currentBatch = batch;

      document.getElementById("batchArea").style.display = "none";

      const detailArea = document.getElementById("detailArea");
      const detailStatus = document.getElementById("detailStatus");
      const imageGroups = document.getElementById("imageGroups");

      detailArea.style.display = "block";
      document.getElementById("detailTitle").textContent = batch.batch_id;
      detailStatus.style.display = "block";
      detailStatus.className = "status-box";
      detailStatus.textContent = "กำลังเตรียมรูปจาก Server...";

      imageGroups.innerHTML = `
        <section class="ca-group">
          <div class="ca-title">กำลังโหลดข้อมูล...</div>
          <div class="image-grid">
            ${Array.from({ length: Math.min(Number(batch.image_count) || 3, 6) }).map(() => `
              <div class="image-card">
                <div class="image-loading">กำลังโหลดรูป...</div>
                <div class="image-name">กำลังเตรียมไฟล์</div>
                <button class="line-share-button" disabled>
                  กำลังโหลด...
                </button>
              </div>
            `).join("")}
          </div>
        </section>
      `;

      requestAnimationFrame(() => {
        detailArea.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      try {
        const result = await qcApi("images", {
          siteCode: batch.site_code,
          rawDate: batch.raw_date,
          batchId: batch.batch_id
        });

        const files = result.files || [];

        if (!files.length) {
          detailStatus.textContent =
            "ไม่พบรูปใน Batch นี้";
          return;
        }

        detailStatus.textContent =
          "พร้อมแล้ว ✓ พบ " + files.length + " ไฟล์ · กำลังโหลดรูป...";

        const groups = {};

        for (const file of files) {
          const fileName = file.name;
          const ca = parseCAFromName(fileName);

          if (!groups[ca]) {
            groups[ca] = [];
          }

          groups[ca].push({
            name: fileName,
            objectPath: file.objectPath
          });
        }

        const caKeys = Object.keys(groups).sort();

        // แสดงโครงหน้าจอทันที ไม่ต้องรอรูปโหลดครบ
        let cardIndex = 0;
        imageGroups.innerHTML = caKeys.map(ca => `
          <section class="ca-group">
            <div class="ca-title">
              CA ${escapeHtml(ca)} · ${groups[ca].length} รูป
            </div>

            <div class="image-grid">
              ${groups[ca].map(img => {
                const id = "imgslot-" + (cardIndex++);
                img.slotId = id;

                return `
                  <div class="image-card">
                    <div id="${id}" class="image-loading">
                      กำลังโหลดรูป...
                    </div>
                    <div class="image-name">${escapeHtml(img.name)}</div>
                    <button
                      class="line-share-button"
                      onclick="shareToLine('${escapeHtml(ca)}', '${escapeHtml(img.name)}')"
                    >
                      ❌ รูปไม่ผ่าน · ส่งเข้า LINE
                    </button>
                    <div class="copy-note">
                      กดเพื่อเลือกเพื่อน / กลุ่ม / แชต
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </section>
        `).join("");

        const allImages = caKeys.flatMap(ca => groups[ca]);
        let loadedCount = 0;
        let failedCount = 0;

        // โหลดทุกภาพพร้อมกัน
        await Promise.allSettled(
          allImages.map(async img => {
            const slot = document.getElementById(img.slotId);

            try {
              const objectUrl = await fetchPrivateImage(
                img.objectPath
              );

              if (slot) {
                slot.outerHTML = `
                  <a
                    href="${objectUrl}"
                    target="_blank"
                    rel="noopener"
                  >
                    <img
                      src="${objectUrl}"
                      alt="${escapeHtml(img.name)}"
                    />
                  </a>
                `;
              }

              loadedCount++;
            } catch (e) {
              failedCount++;

              if (slot) {
                slot.className = "image-error";
                slot.textContent = "เปิดรูปไม่ได้";
              }
            }

            detailStatus.textContent =
              "โหลดแล้ว " +
              (loadedCount + failedCount) +
              "/" +
              files.length +
              " รูป";
          })
        );

        detailStatus.textContent =
          failedCount === 0
            ? "พบ " + files.length + " รูป · " + caKeys.length + " CA ✓"
            : "พบ " + files.length + " รูป · " + caKeys.length +
              " CA · เปิดรูปไม่ได้ " + failedCount + " รูป";

      } catch (error) {
        detailStatus.className = "status-box status-error";
        detailStatus.textContent =
          "ดึงรูปไม่สำเร็จ: " + (error.message || error);
      }
    }

    async function shareToLine(ca, fileName) {
      const batch = window.currentBatch || {};
      const siteSelect = document.getElementById("siteSelect");
      const siteName =
        siteSelect.options[siteSelect.selectedIndex]?.text ||
        batch.site_name ||
        "-";

      const message =
        "❌ รูปไม่ผ่าน\n" +
        "Site: " + siteName + "\n" +
        "CA: " + ca + "\n" +
        "Batch: " + (batch.batch_id || "-") + "\n" +
        "ไฟล์: " + fileName + "\n" +
        "สาเหตุ: รูปไม่ชัด กรุณาตรวจสอบและถ่ายใหม่";

      try {
        if (!window.qcAccessAllowed) {
          alert("บัญชีนี้ยังไม่ได้รับอนุญาตให้เข้า QC");
          return;
        }

        if (!window.liff || !liff.isLoggedIn()) {
          alert("กรุณาเข้าสู่ระบบ LINE ก่อน");
          return;
        }

        if (!liff.isApiAvailable("shareTargetPicker")) {
          alert(
            "อุปกรณ์/เบราว์เซอร์นี้ยังไม่รองรับ shareTargetPicker\n" +
            "กรุณาลองเปิดผ่าน LIFF หรือ LINE อีกครั้ง"
          );
          return;
        }

        const objectPath =
          batch.site_code + "/" +
          batch.raw_date + "/" +
          batch.batch_id + "/" +
          fileName;

        // LINE's server must be able to fetch the image URL itself.
        // Create a longer-lived Supabase signed URL and verify that the URL
        // really returns an image before handing it to shareTargetPicker.
        const signedUrl = await createSignedImageUrl(objectPath);

        const imageCheck = await fetch(signedUrl, {
          method: "GET",
          cache: "no-store"
        });

        if (!imageCheck.ok) {
          const checkText = await imageCheck.text().catch(() => "");
          throw new Error(
            "Signed image URL เปิดไม่ได้ HTTP " +
            imageCheck.status +
            (checkText ? ": " + checkText.slice(0, 160) : "")
          );
        }

        const imageContentType =
          (imageCheck.headers.get("content-type") || "").toLowerCase();

        if (!imageContentType.startsWith("image/")) {
          throw new Error(
            "Signed URL ไม่ได้คืนไฟล์รูปภาพ (" +
            (imageContentType || "ไม่พบ Content-Type") +
            ")"
          );
        }

        const result = await liff.shareTargetPicker(
          [
            {
              type: "image",
              originalContentUrl: signedUrl,
              previewImageUrl: signedUrl
            },
            {
              type: "text",
              text: message
            }
          ],
          {
            isMultiple: true
          }
        );

        if (result) {
          alert("ส่งข้อความและรูปเข้า LINE สำเร็จ ✓");
        }
      } catch (error) {
        alert(
          "ส่งเข้า LINE ไม่สำเร็จ\n" +
          (error && (error.message || error.code)
            ? (error.message || error.code)
            : String(error))
        );
      }
    }

    function closeBatchDetail() {
      document.getElementById("detailArea").style.display = "none";
      document.getElementById("batchArea").style.display = "block";
    }

    setQcEnabled(false);
    initLiff();
  </script>
</body>
</html>
