<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divergent Legacy Cleanup Preview</title>
<style>
html,body{margin:0;height:100%;background:#f5f6fa;font-family:Arial,Tahoma,sans-serif}#legacyFrame{width:100%;height:100%;border:0;display:block}.preview-badge{position:fixed;right:12px;top:10px;z-index:99999;background:#24103f;color:#fff;padding:8px 12px;border-radius:999px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.18);pointer-events:none}
</style>
</head>
<body>
<div class="preview-badge">LEGACY CLEANUP PREVIEW</div>
<iframe id="legacyFrame" src="index.html?legacy_cleanup_preview=1"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('legacyFrame');
  frame.addEventListener('load',function(){
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;

    const style=d.createElement('style');
    style.id='legacy-cleanup-preview-style';
    style.textContent=`
      html,body{zoom:1!important;transform:none!important}
      .main-shell .container,
      body.home-grid5-mode .main-shell .container{
        width:min(1100px,calc(100vw - 40px))!important;
        max-width:1100px!important;
        margin-left:auto!important;
        margin-right:auto!important;
        padding-left:20px!important;
        padding-right:20px!important;
        transform:none!important;
        zoom:1!important;
      }
      @media(max-width:700px){
        .main-shell .container,
        body.home-grid5-mode .main-shell .container{
          width:100%!important;max-width:none!important;
          padding-left:12px!important;padding-right:12px!important;
        }
      }
    `;
    d.head.appendChild(style);

    function homeVisible(){
      const home=d.getElementById('homeWorkspace');
      if(!home)return false;
      const cs=w.getComputedStyle(home);
      return cs.display!=='none'&&cs.visibility!=='hidden'&&!home.hidden;
    }
    function syncScope(){
      if(!d.body)return;
      d.body.classList.toggle('home-grid5-mode',homeVisible());
    }
    syncScope();

    const home=d.getElementById('homeWorkspace');
    if(home)new w.MutationObserver(syncScope).observe(home,{attributes:true,attributeFilter:['style','class','hidden']});
    new w.MutationObserver(function(){
      if(!homeVisible()&&d.body.classList.contains('home-grid5-mode'))d.body.classList.remove('home-grid5-mode');
    }).observe(d.body,{attributes:true,attributeFilter:['class']});

    d.addEventListener('click',function(){w.setTimeout(syncScope,0)},true);
    w.addEventListener('hashchange',syncScope);
    w.addEventListener('popstate',syncScope);
  });
})();
</script>
</body>
</html>
